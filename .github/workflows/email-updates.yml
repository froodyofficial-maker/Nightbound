name: Email big updates
on:
  push:
    branches: [main]
    paths: [public/js/config.js]
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a [Test] copy of the latest update now (records nothing)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: email-updates
jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send any new big updates to the newsletter
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: node tools/email-updates.mjs
      - name: Remember what was sent
        run: |
          if ! git diff --quiet .github/emailed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/emailed.json
            git commit -m "Record emailed updates [skip ci]"
            git push
          fi
